name: CI

on:
  push:
    branches: [main]
    tags: ["*/v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: vet, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: build every tool
        run: |
          for cmd in cmd/*/; do
            name=$(basename "$cmd")
            echo "building $name"
            CGO_ENABLED=0 go build -trimpath -o "/tmp/$name" "./$cmd"
          done

      - name: verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  cross-build:
    name: cross-compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: build static linux/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          for cmd in cmd/*/; do
            name=$(basename "$cmd")
            go build -trimpath -o "/tmp/${name}_${GOARCH}" "./$cmd"
          done
