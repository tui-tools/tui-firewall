# tui-firewall configuration.
#
# Read from /etc/tui-firewall/config.toml first, then
# ~/.config/tui-firewall/config.toml, with the user file overriding the
# machine-wide one. TUI_FIREWALL_* environment variables override both, and
# command line flags override everything.

# Which firewall to drive: "auto", "ufw" or "firewalld".
#
# "auto" takes the installed backend whose service is running. If neither is
# running it takes the one systemd would start at boot, and if neither is
# enabled either, the first one installed (ufw before firewalld). Two firewalls
# on one machine is a misconfiguration rather than a supported setup, so name
# the one you mean here when both are present.
backend = "auto"

# Privilege escalation prefix used when tui-firewall is not running as root.
# "sudo -n" never prompts: run `sudo -v` first, or start tui-firewall with sudo.
# Set to "" to run the firewall command directly.
sudo = "sudo -n"

# Path to an Omarchy-style colors.toml. Empty follows the active Omarchy
# theme when present, and falls back to the built-in Tokyo Night palette.
theme = ""

# Every key can also be set in the environment, upper-cased and prefixed:
#   TUI_FIREWALL_BACKEND=ufw
#   TUI_FIREWALL_SUDO="doas"
#   TUI_FIREWALL_THEME=~/themes/gruvbox/colors.toml
