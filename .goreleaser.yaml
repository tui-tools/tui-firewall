# GoReleaser configuration for tui-firewall.
#
# One repository, one binary, one tag series:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# CI runs `goreleaser release` on a v* tag and attaches static linux/amd64 and
# linux/arm64 archives to the GitHub release. Generated from the template in
# tui-kit/templates/.goreleaser.yaml.
version: 2

project_name: tui-firewall

before:
  hooks:
    - go mod download

builds:
  - id: tui-firewall
    main: ./cmd/tui-firewall
    binary: tui-firewall
    env:
      # Static binaries: no libc dependency, one file to copy anywhere.
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: tui-firewall
    ids:
      - tui-firewall
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - examples/config.toml

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  prerelease: auto
